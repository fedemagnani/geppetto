[package]
name = "geppetto"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
fancy-regex = "0.18.0"
half = "2.7.1"
hotpath = "0.21.5"
libc = "0.2.187"
memmap2 = "0.9"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
# Exposes the deterministic test helpers (`tensor::test`) to bench targets.
test-utils = []

[[bench]]
name = "matmul_nt"
harness = false
required-features = ["test-utils"]

[[bin]]
name = "gguf-inspect"
path = "src/bin/gguf_inspect.rs"

[[bin]]
name = "tokenize"
path = "src/bin/tokenize.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
