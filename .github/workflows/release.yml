name: Release

on:
  push:
    tags:
      - 'build/v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        run: |
          # build/v0.1.0 -> v0.1.0
          VERSION="${GITHUB_REF_NAME#build/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Resolve symlinks in plugins
        run: bash scripts/build-plugins.sh

      - name: Commit resolved plugins to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${{ steps.version.outputs.version }}"
          git add -A
          git commit -m "chore(release): resolve symlinks for ${{ steps.version.outputs.version }}"

      - name: Create release tag
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "release/${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Delete build tag (remote only — local ref kept for changelog)
        run: git push origin --delete "${GITHUB_REF_NAME}"

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip all -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}