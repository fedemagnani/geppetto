name: Commitlint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # commitlint needs the commit range, not just the tip
          fetch-depth: 0

      # with no commitlint config file in the repo this defaults to
      # @commitlint/config-conventional, the same conventional-commit rules
      # cliff.toml's commit_parsers group by
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
